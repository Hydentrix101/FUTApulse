name: FUTApulse Cloud Cron

on:
  schedule:
    # GitHub scheduled jobs can be delayed; the Render worker remains the
    # primary low-latency scheduler when it is enabled.
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  notification-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: futapulse-notification-worker
      cancel-in-progress: false
    env:
      CRON_SECRET_KEY: ${{ secrets.CRON_SECRET_KEY }}
    steps:
      - name: Process due notification jobs
        run: |
          if [ -z "$CRON_SECRET_KEY" ]; then
            echo "CRON_SECRET_KEY is not configured in GitHub Actions secrets." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            --request POST \
            --header "x-cron-secret: ${CRON_SECRET_KEY}" \
            --header "Content-Type: application/json" \
            --data '{"limit":20}' \
            https://futapulse.onrender.com/api/internal/notifications/worker
